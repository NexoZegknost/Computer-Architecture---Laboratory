name: Release

# Publish a release with tag "lab-N" to attach the submission package of
# folder "Lab N": <IDs>_LabN.zip (report PDF + ExerciseK.asm) and the PDF.
on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  attach:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve lab folder
        run: |
          tag="${{ github.event.release.tag_name }}"
          n="${tag#lab-}"
          echo "LAB_DIR=Lab $n" >> "$GITHUB_ENV"
          echo "LAB_NAME=Lab-$n" >> "$GITHUB_ENV"
          test -d "Lab $n" || { echo "::error::Folder 'Lab $n' not found (tag must be lab-N)"; exit 1; }

      - name: Build report
        run: |
          cd "$LAB_DIR/Report"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=build main.tex

      - name: Package submission
        run: |
          apt-get update -qq && apt-get install -y -qq zip >/dev/null
          n="${LAB_NAME#Lab-}"
          # Student ID from \StudentID in info.tex
          ids=$(grep -o '\\StudentID}{[0-9]*}' "$LAB_DIR/Report/config/info.tex" | grep -o '[0-9]\+')
          pkg="${ids}_Lab${n}"
          mkdir -p "pkg/$pkg"
          cp "$LAB_DIR/Report/build/main.pdf" "pkg/$pkg/${pkg}_Report.pdf"
          cp "$LAB_DIR"/Implementation/Exercise*.asm "pkg/$pkg/"
          (cd "pkg/$pkg" && zip "$GITHUB_WORKSPACE/$pkg.zip" ./*)
          cp "pkg/$pkg/${pkg}_Report.pdf" "$GITHUB_WORKSPACE/"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}_Report.pdf
