name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mips:
    name: Assemble MIPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get MARS
        run: |
          if [ ! -f tools/Mars4_5.jar ]; then
            mkdir -p tools
            curl -fsSL -o tools/Mars4_5.jar \
              https://courses.missouristate.edu/kenvollmar/mars/MARS_4_5_Aug2014/Mars4_5.jar
          fi

      - name: Assemble all .asm files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            if java -jar tools/Mars4_5.jar nc a ae1 "$f"; then
              echo "OK"
            else
              echo "::error file=$f::Assemble failed"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -path ./tools -prune -o -name '*.asm' -print0)
          exit $status

  latex:
    name: Build reports
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every Report/main.tex
        run: |
          mkdir -p pdf
          status=0
          while IFS= read -r -d '' tex; do
            dir=$(dirname "$tex")
            lab=$(basename "$(dirname "$dir")")
            echo "::group::$lab"
            if (cd "$dir" && latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=build main.tex); then
              cp "$dir/build/main.pdf" "pdf/${lab// /-}.pdf"
            else
              echo "::error file=$tex::LaTeX build failed"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -path '*/Report/main.tex' -print0)
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: pdf/
          if-no-files-found: ignore
